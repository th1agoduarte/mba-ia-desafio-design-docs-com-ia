# Gateway multi-provider (LiteLLM), opcional. Expõe uma API OpenAI-compatível para as etapas de IA do
# processo (tools/ia.py, rota OpenAI-compatível /v1/chat/completions) e
# encaminha para Gemini, OpenAI, Anthropic ou Bedrock. Opcional: `make ... PROVIDER=gateway`.
#
# Fica em gateway/ porque o docker-compose.yml da raiz é do OMS (MySQL) e não pode ser alterado.
# Rode a partir da raiz: docker compose -f gateway/docker-compose.yml --env-file tools/.env up -d
services:
  llm-gateway:
    image: ghcr.io/berriai/litellm:1.103.9
    container_name: design-docs-llm-gateway
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?defina LITELLM_MASTER_KEY em tools/.env (make env gera uma)}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
