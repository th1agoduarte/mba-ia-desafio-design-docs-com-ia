# Gateway LiteLLM: expõe Gemini, OpenAI, Anthropic e Bedrock atrás de uma API OpenAI-compatível
# (/v1/chat/completions), usada por tools/ia.py quando PROVIDER=gateway.
#
# O modelo é escolhido pelo prefixo no nome, por exemplo:
#   anthropic/claude-haiku-5-5
#   bedrock/<model-id do Bedrock>
#   gemini/gemini-3.5-flash
model_list:
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: "bedrock/*"
    litellm_params:
      model: "bedrock/*"
      aws_region_name: os.environ/AWS_REGION

  - model_name: "gemini/*"
    litellm_params:
      model: "gemini/*"
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  # Descarta parâmetros que o provider de destino não aceita, em vez de devolver erro 400.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
